<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- Label yang terhubung dengan input -->
<label for="email" id="email" name="email" aria-required
placeholder="contoh@email.com">

<!-- Textarea -->
<label for="pesan">pesan:</label>
<textarea id="pesan" name="pesan" rows="5" cols="40"
          placeholder="tuliskan pesan kamu di sini..."></textarea>

<!--Select / Dropdown -->
<label for="jurusan">pilih jurusan</label>
<select id="jurusan" name="jurusan">
    <option value="">--pilih jurusan --</option>
    <optgroup label="teknologi informasi">
        <option value="rpl">Rekayasa perangkat lunak</option>
        <option value="tkj">teknik komputer jaringan</option>
    </optgroup>
    <optgroup label="bisnis">
        <option value="ak"
        <option value="pm">pemasaran</option>
    </optgroup>
</select>

<!-- Field & legend -->
<fieldset>
 <legend>data pribadi</legend>
 <label for="nama">nama: </label>
 <input type="text" id="nama name="nama">
</fieldset>









</body>
</html>
